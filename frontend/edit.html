<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
         <div class="nav-container">
        <a href="/" class="back-link">← Back to Home</a>
    </div>
    <div class="edit-container">
        <h3>Edit User Record</h3>
        <form action="/edit-item" method="POST">
            <label for="editEmail">Enter Email to Edit:</label>
            <input type="email" id="editEmail" name="email" required placeholder="john@example.com">
            <label for="editName">New Name:</label>
            <input type="text" id="editName" name="name" required placeholder="Jane Doe">
            <label for="editAge">New Age:</label>
            <input type="number" id="editAge" name="age" required placeholder="25">
            <label for="editGender">New Gender:</label>
            <select id="editGender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <label for="editCountry">New Country:</label>
            <input type="text" id="editCountry" name="country" required placeholder="USA">
            <label for="editCity">New City:</label>
            <input type="text" id="editCity" name="city" required placeholder="New York">
            <input type="hidden" name="originalEmail" id="originalEmail">
            
            <button type="submit" class="btn-edit">Update User</button>
        </form>
    </div>
    <script>
       
    </script>
</body>
</html>
