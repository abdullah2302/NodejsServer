<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>User Found</title>
   
</head>
<body>
    <div class="message-container details">
        <h2>Found User: {{NAME}}</h2>
        <dl>
            <div><dt>Email</dt><dd>{{EMAIL}}</dd></div>
            <div><dt>Age</dt><dd>{{AGE}}</dd></div>
            <div><dt>Gender</dt><dd>{{GENDER}}</dd></div>
            <div><dt>Country</dt><dd>{{COUNTRY}}</dd></div>
            <div><dt>City</dt><dd>{{CITY}}</dd></div>
        </dl>
        <a href="/">Go Back</a>
    </div>
</body>
</html>
