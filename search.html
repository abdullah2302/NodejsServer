<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Search </title>
</head>
<body>
      
    <div class="nav-container">
        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <div class="search-container">
        <h3>Search User Record</h3>
        <form action="/search-item" method="GET">
            <label for="searchEmail">Enter Email to Search:</label>
            <input type="email" id="searchEmail" name="email" required placeholder="john@example.com">
            <button type="submit" class="btn-search">Search User</button>
        </form>
    </div>
</body>
</html>
